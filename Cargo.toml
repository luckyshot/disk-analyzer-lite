[package]
name = "disk-analyzer-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Fast, modern disk usage analyzer with a treemap view for macOS and Linux"
authors = ["Xavi Esteve (https://xaviesteve.com)"]
license = "MIT"
readme = "README.md"
keywords = ["disk", "treemap", "storage", "cleanup", "tauri"]
categories = ["filesystem", "visualization"]
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
libc = "0.2"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
